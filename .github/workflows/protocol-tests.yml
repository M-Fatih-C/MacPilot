name: Shared protocol contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test pure protocol contracts
        run: |
          xcodebuild -project MacPilot.xcodeproj -scheme MacPilotTests \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO \
            -only-testing:MacPilotTests/NetworkingTests \
            -only-testing:MacPilotTests/FileTransferTests test
